name: AWS Staging Deploy

on:
  push:
    branches: [ "main" ]

# No AWS key is stored. The job asks GitHub for an OIDC token (id-token: write)
# and exchanges it for one hour on the role named in "Configure AWS
# Credentials". See CLAUDE.md, "AWS access".
permissions:
  id-token: write
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # full history, so each page gets its own last-modified date

    - name: Install Hugo
      run: bash tools/install-hugo.sh

    - name: Hugo Compile
      run: hugo --minify --enableGitInfo --baseURL "https://staging.softwarependula.net"

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::176595869252:role/SoftwarependulaDeployRole
        aws-region: us-east-1

    - name: Deploy to S3
      run: |
        bash tools/deploy.sh staging.softwarependula.net
        aws cloudfront create-invalidation --distribution-id E3TETIEU2CNJME --paths "/*"
