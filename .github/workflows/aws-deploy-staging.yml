name: AWS Staging Deploy

on:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # full history, so each page gets its own last-modified date

    - name: Install Hugo
      run: bash tools/install-hugo.sh

    - name: Hugo Compile
      run: hugo --minify --enableGitInfo --baseURL "https://staging.softwarependula.net"

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to S3
      run: |
        bash tools/deploy.sh staging.softwarependula.net
        aws cloudfront create-invalidation --distribution-id E3TETIEU2CNJME --paths "/*"
