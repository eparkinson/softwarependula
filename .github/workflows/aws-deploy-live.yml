name: AWS Live Deploy

on: workflow_dispatch

# No AWS key is stored. The job asks GitHub for an OIDC token (id-token: write)
# and exchanges it for one hour on the role named in "Configure AWS
# Credentials". See CLAUDE.md, "AWS access".
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # full history, so each page gets its own last-modified date

    - name: Install Hugo
      run: bash tools/install-hugo.sh

    - name: Hugo Compile
      run: hugo --minify --enableGitInfo

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::176595869252:role/SoftwarependulaDeployRole
        aws-region: us-east-1

    - name: Deploy to S3
      run: |
        # Keep a copy of the build in the build repository, as before.
        aws s3 sync ./public/ s3://bz-build-repository/live/www.softwarependula.net --delete
        # The live site is served from this bucket (CloudFront in front of it does not cache,
        # so no invalidation is needed). Staging works the same way with its own bucket.
        bash tools/deploy.sh www.softwarependula.net
