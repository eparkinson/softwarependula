name: AWS Live Deploy

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0 # full history, so each page gets its own last-modified date
    - uses: hashicorp/setup-terraform@v1

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: install-aws-cli
      uses: unfor19/install-aws-cli-action@v1
      with:
        version: 2
        verbose: false

    - name: Hugo Compile
      run: |
        sudo apt-get install hugo
        hugo --minify --enableGitInfo

    - name: Terraform Deploy to S3

      run: |
        # Keep a copy of the build in the build repository, as before.
        aws s3 sync ./public/ s3://bz-build-repository/live/www.softwarependula.net --delete
        # The live site is served from this bucket (CloudFront in front of it does not cache,
        # so no invalidation is needed). Staging works the same way with its own bucket.
        aws s3 sync ./public/ s3://www.softwarependula.net --delete