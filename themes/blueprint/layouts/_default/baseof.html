<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
{{ partial "head.html" . }}
<body>
<div class="band">
  <div class="wrap">
    {{ partial "site-header.html" . }}
    {{ block "hero" . }}
    <div class="hero">
      <h1>{{ .Title }}</h1>
    </div>
    {{ end }}
  </div>
</div>
<div class="wrap">
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "site-footer.html" . }}
</div>
</body>
</html>
