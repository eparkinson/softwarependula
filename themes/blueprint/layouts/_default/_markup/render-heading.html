{{- /* Posts write their sections as "#". The post title is the page's only <h1>, so
       headings in the text are rendered one level down. */ -}}
{{- $level := add .Level 1 -}}
{{- if gt $level 6 }}{{ $level = 6 }}{{ end -}}
<h{{ $level }} id="{{ .Anchor | safeURL }}">{{ .Text | safeHTML }}</h{{ $level }}>
