<header class="site-header{{ if .IsHome }} site-header--home{{ end }}">
  {{ if not .IsHome }}<a class="wordmark" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>{{ end }}
  <nav class="site-nav" aria-label="Main">
    {{ $current := . }}
    {{ range .Site.Menus.main }}
    <a href="{{ .URL }}"{{ if hasPrefix $current.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"></circle><path d="M10 3a7 7 0 0 0 0 14z" fill="currentColor"></path></svg>
    </button>
  </nav>
</header>
